{% if pager and pager.total_pages > 1 %}
<nav aria-label="Pagination" class="mt-4">
    <ul class="pagination justify-content-center flex-wrap mb-0">
        {% if pager.has_prev %}
            <li class="page-item">
                <a class="page-link" href="{{ base_url }}?page={{ pager.prev_page }}{{ extra_qs }}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
        {% else %}
            <li class="page-item disabled"><span class="page-link">&laquo;</span></li>
        {% endif %}

        {% for p in range(1, pager.total_pages + 1) %}
            <li class="page-item {{ 'active' if p == pager.page }}">
                <a class="page-link" href="{{ base_url }}?page={{ p }}{{ extra_qs }}">{{ p }}</a>
            </li>
        {% endfor %}

        {% if pager.has_next %}
            <li class="page-item">
                <a class="page-link" href="{{ base_url }}?page={{ pager.next_page }}{{ extra_qs }}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        {% else %}
            <li class="page-item disabled"><span class="page-link">&raquo;</span></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
